<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 500px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        
        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            background: white;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 8px;
            display: none;
        }
        
        .result.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .result-label {
            font-size: 14px;
            color: #888;
            margin-bottom: 8px;
        }
        
        .email-display {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .email-text {
            flex: 1;
            font-size: 18px;
            font-weight: 600;
            color: #333;
            word-break: break-all;
        }
        
        .copy-btn {
            width: auto;
            padding: 8px 16px;
            font-size: 14px;
        }
        
        .history {
            margin-top: 30px;
        }
        
        .history h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
        }
        
        .email-list {
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .email-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
            gap: 10px;
        }
        
        .email-item-email {
            color: #555;
            font-size: 14px;
            word-break: break-all;
            flex: 1;
        }
        
        .email-item-copy {
            width: auto;
            padding: 6px 12px;
            font-size: 12px;
            background: #6c757d;
        }
        
        .email-item-delete {
            background: #dc3545;
        }
        
        .email-item-delete:hover {
            background: #c82333;
        }
        
        .empty-state {
            text-align: center;
            color: #888;
            padding: 20px;
        }
        
        .export-btn {
            background: #28a745;
            margin-top: 10px;
        }
        
        .export-btn:hover {
            background: #218838;
            box-shadow: 0 8px 20px rgba(40, 167, 69, 0.4);
        }
        
        .edit-domains-btn {
            background: #6c757d;
            margin-top: 10px;
        }
        
        .edit-domains-btn:hover {
            background: #5a6268;
            box-shadow: 0 8px 20px rgba(108, 117, 125, 0.4);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
        }
        
        .modal:hover {
            cursor: pointer;
        }
        
        .modal-content:hover {
            cursor: default;
        }
        
        .modal-content h2 {
            margin-bottom: 20px;
            color: #333;
        }
        
        .domain-list {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        
        .domain-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .domain-item span {
            flex: 1;
        }
        
        .domain-item button {
            width: auto;
            padding: 6px 12px;
            font-size: 12px;
            margin-left: 8px;
        }
        
        .delete-btn {
            background: #dc3545;
        }
        
        .delete-btn:hover {
            background: #c82333;
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .modal-buttons button {
            flex: 1;
        }
        
        .cancel-btn {
            background: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📧 Email Generator</h1>
        
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter name (e.g., John Doe)">
        </div>
        
        <div class="form-group">
            <label for="domain">Domain</label>
            <select id="domain">
                <option value="">Select domain...</option>
                <option value="gmail.com">gmail.com</option>
                <option value="outlook.com">outlook.com</option>
                <option value="seznam.cz">seznam.cz</option>
            </select>
        </div>
        
        <button onclick="generateEmail()">Generate Email</button>
        
        <div class="result" id="result">
            <div class="result-label">Generated Email:</div>
            <div class="email-display">
                <span class="email-text" id="emailText"></span>
                <button class="copy-btn" onclick="copyEmail()">Copy</button>
            </div>
        </div>
        
        <div class="history">
            <h2>Recent Emails</h2>
            <ul class="email-list" id="emailList">
                <li class="empty-state">No emails generated yet</li>
            </ul>
            <button class="export-btn" onclick="exportEmails()">📥 Export All Emails</button>
            <button class="edit-domains-btn" onclick="openDomainEditor()">⚙️ Edit Domains</button>
            <button class="edit-domains-btn" id="deleteModeBtn" onclick="toggleDeleteMode()">🗑️ Delete Mode</button>
        </div>
    </div>
    
    <!-- Domain Editor Modal -->
    <div class="modal" id="domainModal">
        <div class="modal-content">
            <h2>🔐 Edit Domains</h2>
            <div class="form-group">
                <label for="adminPassword">Enter Password (123)</label>
                <input type="password" id="adminPassword" placeholder="Enter password">
            </div>
            <div style="display: flex; gap: 10px;">
                <button onclick="verifyPassword()">Unlock</button>
                <button class="cancel-btn" onclick="closeDomainModal()">Cancel</button>
            </div>
            
            <div id="domainEditor" style="display: none;">
                <div class="form-group">
                    <label for="newDomain">Add New Domain</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="newDomain" placeholder="e.g., company.com">
                        <button onclick="addDomain()" style="width: auto;">Add</button>
                    </div>
                </div>
                <div class="domain-list" id="domainList"></div>
                <div class="modal-buttons">
                    <button class="cancel-btn" onclick="closeDomainModal()">Close</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const STORAGE_KEY = 'generated_emails';
        let lastGeneratedEmail = '';
        let deleteMode = false;
        
        // JSONBin configuration
        const JSONBIN_API_KEY = '$2a$10$beAVa9WiIA0n1P7PxK8gNurqI9h9zJ6CyaExzKr.z8sR.M7enRbXG';
        const JSONBIN_COLLECTION_ID = '69f20655aaba882197502c84';
        const JSONBIN_BASE_URL = 'https://api.jsonbin.io/v3/b';
        
        // Load emails from JSONBin or localStorage
        async function getEmails() {
            try {
                const response = await fetch(`${JSONBIN_BASE_URL}/${JSONBIN_COLLECTION_ID}/latest`, {
                    headers: {
                        'X-Access-Key': JSONBIN_API_KEY
                    }
                });
                if (response.ok) {
                    const data = await response.json();
                    return data.record || [];
                }
            } catch (e) {
                console.log('JSONBin unavailable, using localStorage');
            }
            // Fallback to localStorage
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }
        
        // Save emails to JSONBin and localStorage
        async function saveEmails(emails) {
            // Save to localStorage as backup
            localStorage.setItem(STORAGE_KEY, JSON.stringify(emails));
            
            try {
                await fetch(`${JSONBIN_BASE_URL}/${JSONBIN_COLLECTION_ID}`, {
                    method: 'PUT',
                    headers: {
                        'X-Access-Key': JSONBIN_API_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(emails)
                });
            } catch (e) {
                console.log('Failed to save to JSONBin, local backup saved');
            }
        }
        
        // Generate email
        async function generateEmail() {
            const name = document.getElementById('name').value.trim();
            const domain = document.getElementById('domain').value;
            
            if (!name || !domain) {
                alert('Please enter name and select a domain');
                return;
            }
            
            // Convert name to email format (lowercase, replace spaces with dots)
            const email = name.toLowerCase().replace(/\s+/g, '.') + '@' + domain;
            
            // Get existing emails
            const emails = await getEmails();
            
            // Add new email at the beginning
            emails.unshift({
                email: email,
                name: name,
                domain: domain,
                createdAt: new Date().toISOString()
            });
            
            // Keep only last 50 emails
            if (emails.length > 50) {
                emails.splice(50);
            }
            
            // Save to JSONBin and localStorage
            await saveEmails(emails);
            
            // Display result
            lastGeneratedEmail = email;
            document.getElementById('emailText').textContent = email;
            document.getElementById('result').classList.add('show');
            
            // Update the list
            await renderEmailList();
            
            // Clear input fields
            document.getElementById('name').value = '';
            document.getElementById('domain').value = '';
        }
        
        // Copy email to clipboard
        function copyEmail() {
            navigator.clipboard.writeText(lastGeneratedEmail).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.textContent = 'Copied!';
                setTimeout(() => btn.textContent = 'Copy', 2000);
            });
        }
        
        // Copy from list
        function copyFromList(email) {
            navigator.clipboard.writeText(email).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = 'Copied!';
                setTimeout(() => btn.textContent = originalText, 2000);
            });
        }
        
        // Render email list
        async function renderEmailList() {
            const emails = await getEmails();
            const list = document.getElementById('emailList');
            
            if (emails.length === 0) {
                list.innerHTML = '<li class="empty-state">No emails generated yet</li>';
                return;
            }
            
            list.innerHTML = emails.map((item, index) => `
                <li class="email-item">
                    <span class="email-item-email">${item.email}</span>
                    <div style="display: flex; gap: 5px;">
                        <button class="copy-btn email-item-copy" onclick="copyFromList('${item.email}')">Copy</button>
                        ${deleteMode ? `<button class="email-item-delete" onclick="deleteEmail(${index})">Delete</button>` : ''}
                    </div>
                </li>
            `).join('');
        }
        
        // Load emails on page load
        renderEmailList();
        
        // Export all emails to CSV
        async function exportEmails() {
            const emails = await getEmails();
            
            if (emails.length === 0) {
                alert('No emails to export');
                return;
            }
            
            // Create CSV content
            const headers = ['Email', 'Name', 'Domain', 'Created At'];
            const rows = emails.map(e => [
                e.email,
                e.name,
                e.domain,
                new Date(e.createdAt).toLocaleString()
            ]);
            
            const csv = [headers, ...rows]
                .map(row => row.map(cell => `"${cell}"`).join(','))
                .join('\n');
            
            // Download file
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `emails-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        // Domain management
        const DOMAINS_KEY = 'email_domains';
        const DEFAULT_DOMAINS = ['gmail.com', 'outlook.com', 'seznam.cz'];
        
        function getDomains() {
            const data = localStorage.getItem(DOMAINS_KEY);
            return data ? JSON.parse(data) : DEFAULT_DOMAINS;
        }
        
        function saveDomains(domains) {
            localStorage.setItem(DOMAINS_KEY, JSON.stringify(domains));
            updateDomainDropdown();
        }
        
        function updateDomainDropdown() {
            const domains = getDomains();
            const select = document.getElementById('domain');
            const currentValue = select.value;
            select.innerHTML = '<option value="">Select domain...</option>' +
                domains.map(d => `<option value="${d}">${d}</option>`).join('');
            if (currentValue && domains.includes(currentValue)) {
                select.value = currentValue;
            }
        }
        
        function openDomainEditor() {
            const modal = document.getElementById('domainModal');
            modal.classList.add('show');
            document.getElementById('adminPassword').value = '';
            document.getElementById('domainEditor').style.display = 'none';
            
            // Close modal when clicking outside
            modal.onclick = function(event) {
                if (event.target === modal) {
                    closeDomainModal();
                }
            };
        }
        
        function closeDomainModal() {
            document.getElementById('domainModal').classList.remove('show');
        }
        
        function verifyPassword() {
            const password = document.getElementById('adminPassword').value;
            if (password === '123') {
                document.getElementById('domainEditor').style.display = 'block';
                renderDomainList();
            } else {
                alert('Incorrect password');
            }
        }
        
        function renderDomainList() {
            const domains = getDomains();
            const list = document.getElementById('domainList');
            list.innerHTML = domains.map((d, i) => `
                <div class="domain-item">
                    <span>${d}</span>
                    <div>
                        <button class="delete-btn" onclick="deleteDomain(${i})">Delete</button>
                    </div>
                </div>
            `).join('');
        }
        
        function addDomain() {
            const newDomain = document.getElementById('newDomain').value.trim().toLowerCase();
            if (!newDomain) {
                alert('Please enter a domain');
                return;
            }
            const domains = getDomains();
            if (domains.includes(newDomain)) {
                alert('Domain already exists');
                return;
            }
            domains.push(newDomain);
            saveDomains(domains);
            document.getElementById('newDomain').value = '';
            renderDomainList();
        }
        
        function deleteDomain(index) {
            if (confirm('Are you sure you want to delete this domain?')) {
                const domains = getDomains();
                domains.splice(index, 1);
                saveDomains(domains);
                renderDomainList();
            }
        }
        
        // Initialize domains on page load
        updateDomainDropdown();
        
        function toggleDeleteMode() {
            const password = prompt('Enter password to enable delete mode:');
            if (password === '123') {
                deleteMode = !deleteMode;
                const btn = document.getElementById('deleteModeBtn');
                if (deleteMode) {
                    btn.textContent = '❌ Exit Delete';
                    btn.style.background = '#dc3545';
                } else {
                    btn.textContent = '🗑️ Delete Mode';
                    btn.style.background = '';
                }
                renderEmailList();
            } else if (password !== null) {
                alert('Incorrect password');
            }
        }
        
        async function deleteEmail(index) {
            if (confirm('Are you sure you want to delete this email?')) {
                const emails = await getEmails();
                emails.splice(index, 1);
                await saveEmails(emails);
                await renderEmailList();
            }
        }
    </script>
</body>
</html>
