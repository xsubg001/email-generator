<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 500px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 8px;
            display: none;
        }
        
        .result.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .result-label {
            font-size: 14px;
            color: #888;
            margin-bottom: 8px;
        }
        
        .email-display {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .email-text {
            flex: 1;
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }
        
        .copy-btn {
            padding: 8px 16px;
            background: #28a745;
            font-size: 14px;
        }
        
        .copy-btn:hover {
            background: #218838;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.4);
        }
        
        .history {
            margin-top: 30px;
        }
        
        .history h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
        }
        
        .email-list {
            list-style: none;
        }
        
        .email-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        
        .email-item-email {
            color: #555;
            font-size: 14px;
        }
        
        .email-item-copy {
            padding: 6px 12px;
            font-size: 12px;
            background: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📧 Email Generator</h1>
        
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter name (e.g., John Doe)">
        </div>
        
        <div class="form-group">
            <label for="domain">Domain</label>
            <input type="text" id="domain" placeholder="Enter domain (e.g., example.com)">
        </div>
        
        <button onclick="generateEmail()">Generate Email</button>
        
        <div class="result" id="result">
            <div class="result-label">Generated Email:</div>
            <div class="email-display">
                <span class="email-text" id="emailText"></span>
                <button class="copy-btn" onclick="copyEmail()">Copy</button>
            </div>
        </div>
        
        <div class="history" id="history">
            <h2>Recent Emails</h2>
            <ul class="email-list" id="emailList"></ul>
        </div>
    </div>
    
    <script>
        let lastGeneratedEmail = '';
        
        async function generateEmail() {
            const name = document.getElementById('name').value.trim();
            const domain = document.getElementById('domain').value.trim();
            
            if (!name || !domain) {
                alert('Please enter both name and domain');
                return;
            }
            
            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, domain })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    lastGeneratedEmail = data.email;
                    document.getElementById('emailText').textContent = data.email;
                    document.getElementById('result').classList.add('show');
                    loadEmails();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (err) {
                alert('Failed to generate email');
            }
        }
        
        function copyEmail() {
            navigator.clipboard.writeText(lastGeneratedEmail).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.textContent = 'Copied!';
                setTimeout(() => btn.textContent = 'Copy', 2000);
            });
        }
        
        async function loadEmails() {
            try {
                const response = await fetch('/api/emails');
                const emails = await response.json();
                
                const list = document.getElementById('emailList');
                list.innerHTML = emails.slice(0, 5).map(email => `
                    <li class="email-item">
                        <span class="email-item-email">${email.email}</span>
                        <button class="copy-btn" onclick="copyFromList('${email.email}')">Copy</button>
                    </li>
                `).join('');
            } catch (err) {
                console.error('Failed to load emails');
            }
        }
        
        function copyFromList(email) {
            navigator.clipboard.writeText(email).then(() => {
                alert('Copied: ' + email);
            });
        }
        
        // Load emails on page load
        loadEmails();
    </script>
</body>
</html>
